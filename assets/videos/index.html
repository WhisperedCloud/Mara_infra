<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mara Infra – Why Choose Us</title>
<style>
  :root { --bg:#0e1116; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); }
  body { display:flex; align-items:center; justify-content:center; }

  /* The video is 9:16 (portrait). It scales to fit ANY screen without
     cropping, so every title, slide, overlay and phone number stays visible. */
  .video-wrap {
    position:relative;
    aspect-ratio:9 / 16;
    height:100vh;          /* fallback */
    height:100dvh;
    max-width:100vw;
    background:#000;
  }
  .video-wrap video {
    width:100%; height:100%;
    object-fit:contain;
    display:block;
  }

  /* Wide screens: keep a comfortable maximum size, centred */
  @media (min-width:900px) {
    .video-wrap { height:min(100dvh, 960px); border-radius:12px; overflow:hidden; }
  }
</style>
</head>
<body>

<div class="video-wrap">
  <video id="v" controls playsinline preload="metadata" poster="poster1.jpg">
    <source src="why-choose-us-1080.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
</div>

<script>
/* Pick the best rendition for the screen size + connection.
   Uses the displayed video height (in device pixels) as the target. */
(function () {
  var v = document.getElementById('v');
  var c = navigator.connection || {};
  var h = v.clientHeight * (window.devicePixelRatio || 1);
  var slow = c.saveData || /2g|3g/.test(c.effectiveType || '');
  var src = 'why-choose-us-1080.mp4';
  if (slow || h <= 900) src = 'why-choose-us-480.mp4';
  else if (h <= 1400) src = 'why-choose-us-720.mp4';
  if (!v.currentSrc.endsWith(src)) { v.src = src; v.load(); }
})();
</script>
</body>
</html>
